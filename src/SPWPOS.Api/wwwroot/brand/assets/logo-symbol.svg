<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-label="PLANORA Symbol">
  <defs>
    <!-- Main Brand Aurora Gradient: Cyan -> Electric Blue -> Violet -->
    <linearGradient id="ribbon-main" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="48%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Loop Fold Gradient for Dimensional Overlap Depth -->
    <linearGradient id="ribbon-loop" x1="100%" y1="20%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Under-Fold Shade (Adaptive Return) -->
    <linearGradient id="ribbon-fold" x1="80%" y1="60%" x2="20%" y2="30%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Specular Highlight for Liquid Glass Effect -->
    <linearGradient id="specular-glass" x1="20%" y1="10%" x2="90%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Ambient Inner Shadow -->
    <linearGradient id="ambient-depth" x1="50%" y1="30%" x2="50%" y2="80%">
      <stop offset="0%" stop-color="#071A3D" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#071A3D" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Ambient Shadow for Grounded Dimension -->
  <ellipse cx="58" cy="106" rx="34" ry="5" fill="url(#ambient-depth)" />

  <!-- Ribbon 1: The Base Spine & Adaptive Upward Flow -->
  <path d="M 32 100 C 32 102 34 104 37 104 C 42 104 46 99 47 94 L 54 48 C 55 42 58 36 64 34 L 70 32 C 77 30 83 33 86 38 L 86 38 C 91 46 89 57 80 63 L 64 74 C 58 78 51 77 47 72 L 44 68 L 38 100 Z" fill="url(#ribbon-fold)" opacity="0.9" />

  <!-- Ribbon 2: Continuous Flowing Loop of the P (Forward Cycle) -->
  <path d="M 34 102 C 31 102 29 99 30 95 L 39 36 C 41 22 53 14 67 14 C 84 14 98 27 98 44 C 98 62 84 76 68 76 C 60 76 53 73 48 68 L 48 57 C 52 61 58 64 64 64 C 76 64 85 55 85 43 C 85 32 76 25 65 25 C 57 25 49 30 47 38 L 38 95 C 37 99 35 102 34 102 Z" fill="url(#ribbon-main)" />

  <!-- Ribbon 3: Inner Returning Wave / Play-Forward Negative Space Bridge -->
  <path d="M 68 76 C 59 76 51 72 46 66 L 53 58 C 56 61 60 63 65 63 C 71 63 76 60 78 56 C 81 50 78 44 72 42 L 56 37 C 48 34 43 27 45 19 C 46 14 50 11 55 11 C 51 14 49 19 48 24 L 40 76 C 44 80 50 82 56 82 L 68 76 Z" fill="url(#ribbon-loop)" />

  <!-- Glass Specular Gloss Edge (Reflective Precision Ridge) -->
  <path d="M 32 94 L 40 37 C 42 24 53 16 66 16 C 82 16 95 28 95 44 C 95 56 87 67 76 72" stroke="url(#specular-glass)" stroke-width="2" stroke-linecap="round" />

  <!-- Inner Loop Specular Rim -->
  <path d="M 48 40 C 49 33 56 27 65 27 C 74 27 82 33 82 43 C 82 52 74 61 64 61 C 59 61 54 58 50 54" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round" />
</svg>
