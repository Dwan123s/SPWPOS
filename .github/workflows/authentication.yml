name: Authentication security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start isolated SQL Server with an ephemeral random credential
        shell: bash
        run: |
          SQL_PASSWORD="$(openssl rand -base64 32)aA9!"
          echo "::add-mask::$SQL_PASSWORD"
          printf 'SPWPOS_TEST_SQLSERVER=Server=localhost,1433;Database=master;User Id=sa;Password=%s;Encrypt=True;TrustServerCertificate=True\n' "$SQL_PASSWORD" >> "$GITHUB_ENV"
          docker run -d --name spwpos-test-sql -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SQL_PASSWORD" mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
          for attempt in $(seq 1 60); do
            if docker exec -e SQLCMDPASSWORD="$SQL_PASSWORD" spwpos-test-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Locked restore and Release build
        run: |
          dotnet tool restore
          dotnet restore --locked-mode
          dotnet build -c Release --no-restore
      - name: All tests, including actual SQL Server races
        run: |
          test -n "$SPWPOS_TEST_SQLSERVER"
          dotnet test -c Release --no-build --logger trx --results-directory TestResults
          dotnet ef migrations has-pending-model-changes --project src/SPWPOS.Infrastructure
      - name: Browser module regression tests
        run: node --experimental-default-type=module --test tests/browser/session-refresh.test.mjs tests/browser/analysis-state.test.mjs tests/browser/calendar-view.test.mjs
      - name: Dependency vulnerability report
        run: |
          dotnet list package --vulnerable --include-transitive --format json > TestResults/package-audit.json
          python3 - <<'PY'
          import json
          with open('TestResults/package-audit.json') as handle:
              audit = json.load(handle)
          found = [(p['path'], f['framework'], d['id'])
                   for p in audit.get('projects', []) for f in p.get('frameworks', [])
                   for key in ('topLevelPackages', 'transitivePackages') for d in f.get(key, [])
                   if d.get('vulnerabilities')]
          if found:
              raise SystemExit('Vulnerable packages: ' + repr(found))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentication-test-results
          path: TestResults
