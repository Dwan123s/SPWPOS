services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SPWPOS_SQL_PASSWORD:?Set SPWPOS_SQL_PASSWORD or run scripts/Initialize-Development.ps1}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - spwpos-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  spwpos-sql-data:
    name: ${SPWPOS_SQL_VOLUME_NAME:-spwpos-sql-data}
    external: true
